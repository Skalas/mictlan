[project]
name = "mictlan"
version = "0.1.0"
description = "Centralized dreaming (memory consolidation) engine for the agent ecosystem"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
web = ["playwright>=1.44"]
dev = ["pytest>=8.0", "mypy>=1.10", "ruff>=0.5", "types-PyYAML", "types-jsonschema"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mictlan"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"

# Keep the gate green regardless of how mypy is invoked: playwright is an optional
# extra with no stubs, and yaml/jsonschema stubs live in the `dev` extra (used for
# real checking when installed; ignored, not fatal, when a bare `mypy .` runs
# without them). types-PyYAML / types-jsonschema in `dev` still supply full stubs.
[[tool.mypy.overrides]]
module = ["playwright.*", "yaml", "jsonschema", "jsonschema.*"]
ignore_missing_imports = true
